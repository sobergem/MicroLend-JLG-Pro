# .coderabbit.yaml
language: "en" # Sets the AI's response language to English

reviews:
  profile: "chill"
  auto_review:
    enabled: true
    ignore_paths:
      - "**/build/**"
      - "**/*.xml" # Optional: ignores layout/drawable noise; remove if you want XML reviews
      - "**/generated/**"
      - "*.md"
  tools:
    ast-grep:
      enabled: true
    linters:
      enabled: true

instructions: >
  Please focus on Android-specific best practices:
  1. Check for proper use of Jetpack Compose 'remember' and 'derivedStateOf'.
  2. Ensure ViewModels do not hold references to Activities or Contexts.
  3. Flag any heavy operations missing 'Dispatchers.IO'.
  4. Ensure UI strings are not hardcoded (suggest using strings.xml).